# Runs both test suites on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript tests (node:test, no dependencies)
        run: npm test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python tests (includes JS/Python parity checks)
        run: |
          pip install -r python/requirements-dev.txt
          pytest -q
